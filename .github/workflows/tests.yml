name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Run syntax checks
        run: python -m compileall -q src tests
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Verify package entry point
        run: python -m casebook --version
        working-directory: .
      - name: Verify digest export and verification
        run: |
          python -m casebook init .ci-casebook --title "CI digest smoke test"
          python -m casebook add .ci-casebook examples/casebook-demo-bundle.zip --source "CI smoke test"
          python -m casebook digest .ci-casebook --out .ci-casebook.digest.json
          python -m casebook digest .ci-casebook --verify .ci-casebook.digest.json
